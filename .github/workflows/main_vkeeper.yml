name: CI/CD — Build, Testes e Deploy (VKeeper)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Testes Unitários e Integração (SQL Server)
    runs-on: ubuntu-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Express"
          MSSQL_SA_PASSWORD: "VKeeper_Ci_Temp123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P VKeeper_Ci_Temp123! -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P VKeeper_Ci_Temp123! -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependências
        run: dotnet restore VKeeper.sln

      - name: Compilar solução (Release)
        run: dotnet build VKeeper.sln --no-restore --configuration Release

      - name: Executar testes unitários
        run: dotnet test tests/VKeeper.TestesUnitarios/VKeeper.TestesUnitarios.csproj --no-build --configuration Release --verbosity normal

      - name: Executar testes de integração (SQL Server)
        env:
          ConnectionStrings__TestConnection: "Server=localhost,1433;Database=VKeeperDb_Test;User Id=sa;Password=VKeeper_Ci_Temp123!;TrustServerCertificate=True;"
        run: dotnet test tests/VKeeper.TestesIntegracao/VKeeper.TestesIntegracao.csproj --no-build --configuration Release --verbosity normal

      - name: Publicar aplicação Web (Release)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: dotnet publish src/VKeeper.Web/VKeeper.Web.csproj --configuration Release --no-restore --output ./publish

      - name: Gerar bundle de migrations EF Core
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          dotnet tool install --global dotnet-ef --version "10.0.*"
          "$HOME/.dotnet/tools/dotnet-ef" migrations bundle \
            --project src/VKeeper.Infraestrutura/VKeeper.Infraestrutura.csproj \
            --startup-project src/VKeeper.Web/VKeeper.Web.csproj \
            --configuration Release \
            --no-build \
            --force \
            --output ./efbundle/efbundle
          cp src/VKeeper.Web/appsettings.json ./efbundle/appsettings.json

      - name: Enviar artefato da aplicação Web
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vkeeper-web
          path: ./publish
          retention-days: 5

      - name: Enviar artefato do bundle de migrations
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vkeeper-efbundle
          path: ./efbundle
          retention-days: 5

  migrate:
    name: Aplicar Migrations no Azure SQL
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Configurar .NET 10 Runtime/SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Baixar bundle de migrations
        uses: actions/download-artifact@v4
        with:
          name: vkeeper-efbundle
          path: ./efbundle

      - name: Executar migrations EF Core no Azure SQL
        working-directory: ./efbundle
        env:
          SQLSERVER_CONNECTIONSTRING: ${{ secrets.SQLSERVER_CONNECTIONSTRING }}
        run: |
          if [ -z "$SQLSERVER_CONNECTIONSTRING" ]; then
            echo "::error::O secret SQLSERVER_CONNECTIONSTRING não está configurado no repositório."
            exit 1
          fi
          chmod +x ./efbundle
          ./efbundle --connection "$SQLSERVER_CONNECTIONSTRING"

  deploy:
    name: Deploy para Azure Web App (vkeeper)
    runs-on: ubuntu-latest
    needs: [build-and-test, migrate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Baixar artefato da aplicação Web
        uses: actions/download-artifact@v4
        with:
          name: vkeeper-web
          path: ./publish

      - name: Autenticar na Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_22C55B8BE4044CC7B6DCC9F451CEA064 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_88329770C4504923AEE4BCD42AA9F73B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8FDB5FD0ED474C92BCCF14283C80D9B0 }}

      - name: Configurar connection string DefaultConnection no Azure Web App
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          SQLSERVER_CONNECTIONSTRING: ${{ secrets.SQLSERVER_CONNECTIONSTRING }}
        run: |
          APP_NAME="${AZURE_WEBAPP_NAME:-vkeeper}"
          RESOURCE_GROUP="${AZURE_RESOURCE_GROUP:-}"

          if [ -z "$SQLSERVER_CONNECTIONSTRING" ]; then
            echo "::error::O secret SQLSERVER_CONNECTIONSTRING não está configurado no repositório."
            exit 1
          fi

          if [ -z "$RESOURCE_GROUP" ]; then
            RESOURCE_GROUP=$(az webapp list --query "[?name=='${APP_NAME}'].resourceGroup | [0]" -o tsv)
          fi

          if [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::Não foi possível identificar o Resource Group do Web App '${APP_NAME}'. Configure a variable AZURE_RESOURCE_GROUP no GitHub Actions."
            exit 1
          fi

          az webapp config connection-string set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --connection-string-type SQLAzure \
            --settings "DefaultConnection=$SQLSERVER_CONNECTIONSTRING" \
            --output none

      - name: Publicar no Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || 'vkeeper' }}
          slot-name: 'Production'
          package: ./publish
